# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '40 14 * * 3'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    env:
      # Fork PRs get a read-only token, so the SARIF upload would fail.
      RUN_CODEQL: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up JBRSDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'jetbrains'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Initialize CodeQL
      if: env.RUN_CODEQL == 'true'
      uses: github/codeql-action/init@v4
      with:
        languages: java-kotlin
        build-mode: manual

    - name: Compile (traced by CodeQL)
      run: >
        ./gradlew --no-daemon --no-build-cache --no-configuration-cache
        -Pkotlin.compiler.execution.strategy=in-process
        testClasses

    - name: Perform CodeQL Analysis
      if: env.RUN_CODEQL == 'true'
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:java-kotlin"

    - name: Build with Gradle Wrapper
      run: ./gradlew build

  codeql-actions:
    # Fork PRs get a read-only token, so the SARIF upload would fail.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
    - uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: actions
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:actions"

  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up JBRSDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'jetbrains'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v6

