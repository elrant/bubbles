[versions]
# serialization
jackson             = "3.2.4"
jackson-annotations = "2.22"
jackson-bom         = "3.2.0"
jackson-parent      = "2.22"

# logging
slf4j   = "2.0.20"
tinylog = "2.8.1"

# xmpp
jxmpp = "1.1.0"
mdns = "1.1.1"
smack = "4.5.0-rc1"
bcprov = "1.85"
signal = "2.8.1"
dbus = "5.2.2"
zxing = "3.5.4"

# kotlin / compose
kotlin = "2.4.21"
compose = "1.12.2"
coroutines = "1.10.2"
shadow = "9.6.1"

# lint
detekt        = "2.0.0-alpha.6"
compose-rules = "0.6.8"

[libraries]
# serialization
jackson-annotations = { group = "com.fasterxml.jackson.core", name = "jackson-annotations", version.ref = "jackson-annotations"   }
jackson-bom         = { group = "tools.jackson"             , name = "jackson-bom"        , version.ref = "jackson-bom"           }
jackson-parent      = { group = "com.fasterxml.jackson"     , name = "jackson-parent"     , version.ref = "jackson-parent"        }
jackson-core        = { group = "tools.jackson.core", name = "jackson-core"    , version.ref = "jackson" }
jackson-databind    = { group = "tools.jackson.core", name = "jackson-databind", version.ref = "jackson" }

# logging
slf4j-api     = { group = "org.slf4j"  , name = "slf4j-api"    , version.ref = "slf4j"   }
tinylog-api   = { group = "org.tinylog", name = "tinylog-api"  , version.ref = "tinylog" }
tinylog-impl  = { group = "org.tinylog", name = "tinylog-impl" , version.ref = "tinylog" }
tinylog-slf4j = { group = "org.tinylog", name = "slf4j-tinylog", version.ref = "tinylog" }

# xmpp
jxmpp         = { group = "org.jxmpp"               , name = "jxmpp-core"            , version.ref = "jxmpp"  }
jxmpp-jid     = { group = "org.jxmpp"               , name = "jxmpp-jid"             , version.ref = "jxmpp"  }
mdns          = { group = "org.minidns"             , name = "minidns-core"          , version.ref = "mdns"   }
smack-xml     = { group = "org.igniterealtime.smack", name = "smack-xmlparser"       , version.ref = "smack"  }
smack-minidns = { group = "org.igniterealtime.smack", name = "smack-resolver-minidns", version.ref = "smack"  }
smack-xmlstax = { group = "org.igniterealtime.smack", name = "smack-xmlparser-stax"  , version.ref = "smack"  }
smack-core    = { group = "org.igniterealtime.smack", name = "smack-core"            , version.ref = "smack"  }
smack-stream  = { group = "org.igniterealtime.smack", name = "smack-streammanagement", version.ref = "smack"  }
smack-tcp     = { group = "org.igniterealtime.smack", name = "smack-tcp"             , version.ref = "smack"  }
smack-ext     = { group = "org.igniterealtime.smack", name = "smack-extensions"      , version.ref = "smack"  }
smack-experimental = { group = "org.igniterealtime.smack", name = "smack-experimental" , version.ref = "smack"  }
smack-omemo        = { group = "org.igniterealtime.smack", name = "smack-omemo"        , version.ref = "smack"  }
smack-omemo-signal = { group = "org.igniterealtime.smack", name = "smack-omemo-signal" , version.ref = "smack"  }
dbus-core          = { group = "com.github.hypfvieh"     , name = "dbus-java-core"                       , version.ref = "dbus"   }
dbus-unixsocket    = { group = "com.github.hypfvieh"     , name = "dbus-java-transport-native-unixsocket", version.ref = "dbus"   }
zxing-core    = { group = "com.google.zxing"        , name = "core"                 , version.ref = "zxing"  }
signal        = { group = "org.whispersystems"      , name = "signal-protocol-java"  , version.ref = "signal" }
bcprov        = { group = "org.bouncycastle"        , name = "bcprov-jdk18on"        , version.ref = "bcprov" }

# lint
detekt-ktlint        = { group = "dev.detekt"             , name = "detekt-rules-ktlint-wrapper", version.ref = "detekt" }
compose-rules-detekt = { group = "io.nlopez.compose.rules", name = "detekt", version.ref = "compose-rules" }

# coroutines
coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }

[plugins]
kotlin-jvm     = { id = "org.jetbrains.kotlin.jvm"            , version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose" , version.ref = "kotlin" }
compose        = { id = "org.jetbrains.compose"               , version.ref = "compose" }
shadow         = { id = "com.gradleup.shadow"                 , version.ref = "shadow" }
detekt         = { id = "dev.detekt"                          , version.ref = "detekt" }

[bundles]
serialization = [
  "jackson-core",
  "jackson-databind",
  "jackson-annotations",
  "jackson-bom",
  "jackson-parent"
]

logging = [
  "slf4j-api",
  "tinylog-api",
  "tinylog-impl",
  "tinylog-slf4j"
]

xmpp = [
  "jxmpp",
  "jxmpp-jid",
  "mdns",
  "smack-xml",
  "smack-xmlstax",
  "smack-core",
  "smack-stream",
  "smack-minidns",
  "smack-tcp",
  "smack-ext",
  "smack-experimental",
  "smack-omemo",
  "smack-omemo-signal",
  "signal",
  "bcprov"
]

qr = [
  "zxing-core"
]

secrets = [
  "dbus-core",
  "dbus-unixsocket"
]

coroutines = [
  "coroutines-swing"
]
