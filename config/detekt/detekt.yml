# Overrides on top of detekt's default config, with every rule enabled (`allRules` in build.gradle.kts).
# Each disabled rule says why; prefer fixing the code over adding to this list.

Compose:
  active: true
  # Compose's strong skipping (on by default since Kotlin 2.0.20) already skips unchanged List parameters.
  UnstableCollections:
    active: false
  # Composables are camelCase like any other function (naming>FunctionNaming), not Compose's PascalCase.
  ComposableNaming:
    active: false

comments:
  # Private members are documented like the rest of the code, as with Javadoc.
  DocumentationOverPrivateFunction:
    active: false
  DocumentationOverPrivateProperty:
    active: false
  UndocumentedPublicClass:
    ignoreDefaultCompanionObject: true
  # Enum constants like `Available` name themselves.
  UndocumentedPublicProperty:
    ignoreEnumEntries: true

complexity:
  # `return@lambda` is Kotlin's only way to return early from a lambda, like `return` in a Java lambda.
  LabeledExpression:
    active: false
  TooManyFunctions:
    # Bubbles is the app's single state holder; count only its public API.
    ignorePrivate: true

# Formatting (ktlint). Indentation is 4 spaces, as in .editorconfig.
ktlint:
  # Duplicate of naming>FunctionNaming.
  FunctionName:
    active: false
  # The code groups related arguments on one line (`value, onValueChange`, `minLines = 3, maxLines = 5`).
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  # Would split `Builder.builder()` and `val x = try {` onto separate lines.
  ChainMethodContinuation:
    active: false
  MultilineExpressionWrapping:
    active: false
  AnnotationOnSeparateLine:
    indentSize: 4
  BinaryExpressionWrapping:
    indentSize: 4
  ChainWrapping:
    indentSize: 4
  ClassSignature:
    indentSize: 4
  CommentWrapping:
    indentSize: 4
  ConditionWrapping:
    indentSize: 4
  ContextReceiverListWrapping:
    indentSize: 4
  ContextReceiverMapping:
    indentSize: 4
  EnumWrapping:
    indentSize: 4
  ExpressionOperandWrapping:
    indentSize: 4
  FunctionExpressionBody:
    indentSize: 4
  FunctionLiteral:
    indentSize: 4
  FunctionSignature:
    indentSize: 4
  IfElseBracing:
    indentSize: 4
  IfElseWrapping:
    indentSize: 4
  Indentation:
    indentSize: 4
  KdocWrapping:
    indentSize: 4
  ModifierListSpacing:
    indentSize: 4
  MultiLineIfElse:
    indentSize: 4
  MultilineLoop:
    indentSize: 4
  NoEmptyFirstLineInClassBody:
    indentSize: 4
  NoSingleLineBlockComment:
    indentSize: 4
  ParameterWrapping:
    indentSize: 4
  PropertyWrapping:
    indentSize: 4
  SpacingAroundCurly:
    indentSize: 4
  StatementWrapping:
    indentSize: 4
  StringTemplateIndent:
    indentSize: 4
  TryCatchFinallySpacing:
    indentSize: 4
  TypeArgumentListSpacing:
    indentSize: 4
  TypeParameterListSpacing:
    indentSize: 4
  WhenEntryBracing:
    indentSize: 4
  Wrapping:
    indentSize: 4
